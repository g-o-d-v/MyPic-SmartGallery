pluginManagement {
    repositories {
        // 优先使用阿里云镜像下载 Gradle 插件
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }

        // 官方备用源
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // 强制所有模块使用这里的仓库配置
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // 优先使用阿里云镜像下载第三方代码库依赖
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }

        // 官方备用源
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io' // 很多开源库需要的 JitPack 仓库
            // 仅将 JitPack 限定用于 GitHub 坐标，避免非 JitPack 依赖缺失 javadoc/sources 时回退请求 jitpack.io 导致 Sync 卡顿
            content {
                includeGroupByRegex 'com\\.github\\..*'
            }
            // jitpack 上部分库发布的 .module 将 sources/javadoc 指向同名 .jar（实际为 -sources.jar / -javadoc.jar），会导致 IDE Sync 卡死或 404
            metadataSources {
                mavenPom()
                artifact()
            }
        }
    }
}

// 替换为你的项目名称
rootProject.name = "MyPic"
include ':app'