plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goda.mypic'
    compileSdk 34 // 兼容最新 Android 14 API

    defaultConfig {
        applicationId "com.goda.mypic"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 指定只打包 64 位架构，同时减小 APK 体积
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // AGP 8+ 要求使用 Java 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    // 引入 PhotoView 库，实现双指无极缩放，完美兼容 ViewPager2 滑动
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 基础 Android UI 组件库
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ================== 核心业务组件库 ==================

    // 1. Glide图片加载库 (处理上万张图片网格展示防卡顿)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // 2. Room 数据库 (用于保存图片路径、OCR文字、Hash值进行极速搜索)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // 3. WorkManager (用于在后台静默跑 OCR 和生成指纹，避免主线程卡死)
    implementation "androidx.work:work-runtime:2.9.0"

    // 4. 开源 OCR 与文本检索核心库 (内置 PP-OCRv4 与版面阅读顺序重建)
    implementation "com.github.g-o-d-v:android-pdf-search-engine:0.1.0-alpha03"
}